<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHands AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
            margin: 8px 0;
        }

        .message-content code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
        }

        .message.bot .message-content code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button svg {
            width: 24px;
            height: 24px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            margin-bottom: 20px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .sidebar-btn:hover {
            background: #667eea;
            color: white;
        }

        .sidebar-btn svg {
            width: 20px;
            height: 20px;
        }

        .conversation-list {
            position: fixed;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            max-height: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: none;
        }

        .conversation-list.show {
            display: block;
        }

        .conversation-list-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }

        .conversation-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .conversation-item:hover {
            background: #f8f9fa;
        }

        .conversation-item.active {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 连接设置弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- 设置弹窗 -->
    <div class="modal show" id="settingsModal">
        <div class="modal-content">
            <h2>🔧 连接设置</h2>
            <div class="form-group">
                <label>API 地址</label>
                <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
            </div>
            <div class="form-group">
                <label>LLM API 地址</label>
                <input type="text" id="llmApiUrl" value="http://localhost:8881/llm/gemini-3-flash-preview/v1" placeholder="http://localhost:8881/llm/xxx/v1">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="text" id="apiKey" value="sk-test-key" placeholder="输入 API Key">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="connect()">连接</button>
            </div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <button class="sidebar-btn" onclick="toggleConversations()" title="对话列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        </button>
        <button class="sidebar-btn" onclick="newConversation()" title="新建对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button class="sidebar-btn" onclick="showSettings()" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- 对话列表 -->
    <div class="conversation-list" id="conversationList">
        <div class="conversation-list-header">
            对话列表
        </div>
        <div id="conversations"></div>
    </div>

    <!-- 主聊天界面 -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-indicator" id="statusIndicator"></div>
            <h1>🤖 OpenHands AI</h1>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <p>开始一个新对话吧！</p>
            </div>
        </div>
        
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let API_BASE = 'http://localhost:8000';
        let currentConversationId = localStorage.getItem('currentConversationId') || null;
        let conversations = JSON.parse(localStorage.getItem('conversations') || '[]');
        let messageHistory = JSON.parse(localStorage.getItem('messageHistory') || '{}'); // 存储每个对话的消息历史

        // 页面加载完成后检查连接
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/alive`);
                if (response.ok) {
                    document.getElementById('statusIndicator').style.background = '#4ade80';
                    // 连接成功后，加载对话列表
                    await loadConversations();
                    // 如果有之前的会话，加载该会话的历史消息
                    if (currentConversationId) {
                        await switchConversation(currentConversationId);
                    } else {
                        // 自动创建新对话
                        await newConversation();
                    }
                    return true;
                }
            } catch (e) {
                document.getElementById('statusIndicator').style.background = '#ef4444';
            }
            return false;
        }

        // 从后端加载对话列表
        async function loadConversations() {
            try {
                const response = await fetch(`${API_BASE}/api/conversations?page_size=50`);
                const data = await response.json();
                
                if (data.conversations && data.conversations.length > 0) {
                    // 从后端获取对话列表
                    conversations = data.conversations.map(conv => ({
                        id: conv.conversation_id,
                        name: conv.name || `对话 ${conv.conversation_id.slice(0, 8)}`
                    }));
                    localStorage.setItem('conversations', JSON.stringify(conversations));
                    updateConversationList();
                }
            } catch (e) {
                console.log('加载对话列表失败，使用本地存储');
            }
        }

        // 保存对话到本地存储
        function saveConversations() {
            localStorage.setItem('conversations', JSON.stringify(conversations));
            localStorage.setItem('currentConversationId', currentConversationId || '');
        }

        // 保存消息历史到本地存储
        function saveMessageHistory(convId, messages) {
            messageHistory[convId] = messages;
            localStorage.setItem('messageHistory', JSON.stringify(messageHistory));
        }

        let LLM_API_URL = localStorage.getItem('llmApiUrl') || 'http://localhost:8881/llm/gemini-3-flash-preview/v1';
        let API_KEY = localStorage.getItem('apiKey') || 'sk-test-key';

        function connect() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const llmApiUrl = document.getElementById('llmApiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (apiUrl) {
                API_BASE = apiUrl;
                LLM_API_URL = llmApiUrl;
                API_KEY = apiKey;
                
                // 保存到 localStorage
                localStorage.setItem('llmApiUrl', llmApiUrl);
                localStorage.setItem('apiKey', apiKey);
                
                document.getElementById('settingsModal').classList.remove('show');
                checkConnection();
            }
        }

        function showSettings() {
            // 显示当前配置
            document.getElementById('llmApiUrl').value = LLM_API_URL;
            document.getElementById('apiKey').value = API_KEY;
            document.getElementById('settingsModal').classList.add('show');
        }

        // 创建新对话
        async function newConversation() {
            try {
                console.log('创建对话，API_BASE:', API_BASE);
                
                const response = await fetch(`${API_BASE}/api/conversations`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name: `对话 ${new Date().toLocaleString()}`,
                        agent: "CodeAgent",
                        workspace: "/workspace"
                    })
                });
                
                console.log('响应状态:', response.status);
                const data = await response.json();
                console.log('创建对话返回:', data);
                
                if (data.conversation_id) {
                    currentConversationId = data.conversation_id;
                    // 添加到对话列表开头
                    conversations.unshift({
                        id: data.conversation_id,
                        name: `新对话`
                    });
                    // 初始化该对话的消息历史
                    messageHistory[data.conversation_id] = [];
                    saveConversations();
                    saveMessageHistory(data.conversation_id, []);
                    updateConversationList();
                    clearMessages();
                    return data.conversation_id;
                } else {
                    console.error('创建对话失败，返回数据没有 conversation_id:', data);
                    alert('创建对话失败: ' + JSON.stringify(data));
                }
            } catch (e) {
                console.error('创建对话异常:', e);
                alert('创建对话失败: ' + e.message);
            }
            return null;
        }

        // 切换对话列表显示
        function toggleConversations() {
            document.getElementById('conversationList').classList.toggle('show');
        }

        // 更新对话列表
        function updateConversationList() {
            const container = document.getElementById('conversations');
            if (conversations.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding: 20px;">暂无对话</div>';
                return;
            }
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" 
                     onclick="switchConversation('${conv.id}')">
                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${conv.name}</span>
                    <button class="delete-btn" onclick="deleteConversation('${conv.id}', event)" title="删除对话">🗑️</button>
                </div>
            `).join('');
            
            // 添加删除按钮样式
            const style = document.createElement('style');
            style.textContent = `
                .delete-btn {
                    background: none;
                    border: none;
                    cursor: pointer;
                    font-size: 12px;
                    opacity: 0.5;
                    padding: 2px 5px;
                }
                .delete-btn:hover {
                    opacity: 1;
                }
                .conversation-item {
                    display: flex;
                    align-items: center;
                }
            `;
            if (!document.getElementById('deleteBtnStyle')) {
                style.id = 'deleteBtnStyle';
                document.head.appendChild(style);
            }
        }

        // 切换对话
        async function switchConversation(id) {
            currentConversationId = id;
            saveConversations();
            updateConversationList();
            
            // 加载该对话的历史消息
            const messages = messageHistory[id] || [];
            if (messages.length > 0) {
                // 显示历史消息
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.innerHTML = '';
                
                if (messages.length === 0) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state" id="emptyState">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <p>开始一个新对话吧！</p>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                }
            } else {
                // 尝试从后端加载历史
                try {
                    const response = await fetch(`${API_BASE}/api/conversations/${id}/events?page_size=100`);
                    const data = await response.json();
                    
                    if (data.events && data.events.length > 0) {
                        const messagesContainer = document.getElementById('chatMessages');
                        messagesContainer.innerHTML = '';
                        
                        const loadedMessages = [];
                        data.events.forEach(event => {
                            if (event.msg_type === 'text' || event.message) {
                                const content = event.message || event.content || '';
                                if (content.trim()) {
                                    loadedMessages.push({ role: event.sender || 'bot', content: content });
                                    addMessage(event.sender || 'bot', formatMessage(content));
                                }
                            }
                        });
                        
                        // 保存到本地历史
                        if (loadedMessages.length > 0) {
                            messageHistory[id] = loadedMessages;
                            saveMessageHistory(id, loadedMessages);
                        }
                    } else {
                        clearMessages();
                    }
                } catch (e) {
                    console.log('加载历史消息失败:', e);
                    clearMessages();
                }
            }
        }

        // 删除对话
        async function deleteConversation(id, event) {
            event.stopPropagation();
            
            if (!confirm('确定要删除这个对话吗？')) {
                return;
            }
            
            try {
                await fetch(`${API_BASE}/api/conversations/${id}`, {
                    method: 'DELETE'
                });
                
                // 从列表中移除
                conversations = conversations.filter(c => c.id !== id);
                delete messageHistory[id];
                
                saveConversations();
                localStorage.setItem('messageHistory', JSON.stringify(messageHistory));
                
                // 如果删除的是当前对话，切换到第一个或创建新对话
                if (id === currentConversationId) {
                    if (conversations.length > 0) {
                        await switchConversation(conversations[0].id);
                    } else {
                        currentConversationId = null;
                        await newConversation();
                    }
                }
                
                updateConversationList();
            } catch (e) {
                alert('删除对话失败: ' + e.message);
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 确保有有效的会话 ID
            if (!currentConversationId || currentConversationId === 'null') {
                const newId = await newConversation();
                if (!newId) {
                    alert('创建对话失败，请检查后端服务是否启动');
                    return;
                }
                currentConversationId = newId;
            }

            // 显示用户消息
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            // 保存用户消息到历史
            if (!messageHistory[currentConversationId]) {
                messageHistory[currentConversationId] = [];
            }
            messageHistory[currentConversationId].push({ role: 'user', content: message });
            
            // 如果是对话的第一条消息，用它作为对话标题
            const convIndex = conversations.findIndex(c => c.id === currentConversationId);
            if (convIndex !== -1 && conversations[convIndex].name === '新对话') {
                // 取消息前20个字符作为标题
                const title = message.slice(0, 20) + (message.length > 20 ? '...' : '');
                conversations[convIndex].name = title;
                updateConversationList();
                saveConversations();
                
                // 尝试更新后端对话名称
                try {
                    await fetch(`${API_BASE}/api/conversations/${currentConversationId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: title })
                    });
                } catch (e) {
                    console.log('更新对话名称失败');
                }
            }

            // 显示加载状态
            showTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/api/conversations/${currentConversationId}/ask_agent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        question: message
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                let botResponse = '';
                // 显示 AI 响应
                if (data.events) {
                    data.events.forEach(event => {
                        const content = event.observation || event.content || '';
                        if (content.trim()) {
                            botResponse += content + '\n';
                            addMessage('bot', formatMessage(content));
                        }
                    });
                } else if (data.message) {
                    botResponse = data.message;
                    addMessage('bot', formatMessage(data.message));
                } else {
                    botResponse = JSON.stringify(data, null, 2);
                    addMessage('bot', formatMessage(botResponse));
                }
                
                // 保存机器人回复到历史
                if (botResponse.trim()) {
                    messageHistory[currentConversationId].push({ role: 'bot', content: botResponse });
                    saveMessageHistory(currentConversationId, messageHistory[currentConversationId]);
                }
            } catch (e) {
                hideTypingIndicator();
                addMessage('bot', '❌ 发生错误: ' + e.message);
            }
        }

        // 格式化消息
        function formatMessage(message) {
            if (typeof message !== 'string') {
                message = JSON.stringify(message, null, 2);
            }
            // 检测是否是代码块
            if (message.includes('```')) {
                return message.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            }
            // 检测行内代码
            message = message.replace(/`([^`]+)`/g, '<code>$1</code>');
            // 换行处理
            message = message.replace(/\n/g, '<br>');
            return message;
        }

        // 添加消息到界面
        function addMessage(role, content) {
            const messagesContainer = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">${content}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 显示加载指示器
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 隐藏加载指示器
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 清空消息
        function clearMessages() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <p>开始一个新对话吧！</p>
                </div>
            `;
        }

        // 输入框事件处理
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 自动调整输入框高度
        document.getElementById('chatInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 页面加载时检查连接
        window.onload = checkConnection;
    </script>
</body>
</html>
